services:
  mock-hospital:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: mock-hospital
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oraclesys}
      HOSPITAL_MOCK_PASSWORD: ${HOSPITAL_MOCK_PASSWORD:-hospitalmockdev}
      CHEQUEAR_RO_PASSWORD: ${CHEQUEAR_RO_PASSWORD:-devdev}
    ports:
      - "1521:1521"
    volumes:
      - mock-hospital-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d:ro
    healthcheck:
      # El healthcheck nativo de la imagen se vuelve healthy apenas el listener
      # responde, ANTES de que los scripts de seed terminen. Forzamos un check
      # extra que sólo pasa cuando HOSP_PACIENTE tiene >=50 filas (FR-018, SC-001).
      test:
        - "CMD-SHELL"
        - >-
          echo "SET HEAD OFF FEEDBACK OFF PAGESIZE 0;
          SELECT CASE WHEN COUNT(*) >= 50 THEN 'OK' ELSE 'WAIT' END FROM HOSPITAL_MOCK.HOSP_PACIENTE;"
          | sqlplus -S CHEQUEAR_RO/${CHEQUEAR_RO_PASSWORD:-devdev}@//localhost:1521/XEPDB1
          | grep -q OK
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  mock-hospital-data:
