# Allowlist consumida por OracleViewClient (parámetro `allowedViews`).
# Sólo estas vistas pueden ser consultadas; cualquier otra es rechazada
# antes de tocar la base (FR-006).
#
# Cuando llegue el diseño real del hospital, este archivo es uno de los
# tres puntos de cambio (junto con OracleMappings/*.yaml y el DDL del mock).
#
# Parser: AllowlistLoader.cs (formato simple, no requiere YamlDotNet).
# Acepta:
#   * Líneas en blanco -> ignoradas
#   * Líneas con '#' -> comentarios
#   * Líneas con '- VW_X' o 'VW_X' -> agregan VW_X a la allowlist
#   * Cualquier otra cosa antes de la primera vista es ignorada
#     (permite mantener encabezado YAML 'allowed_views:' por convención).

allowed_views:
  - VW_PACIENTE
  - VW_EPISODIO
  - VW_DIAGNOSTICO
  - VW_OBSERVACION_LAB
  - VW_SIGNOS_VITALES
  - VW_MEDICACION
  - VW_ALERGIA
  - VW_PROFESIONAL
  - VW_ESPECIALIDAD
  - VW_TURNO
