# Build y tests unitarios de la solucion completa.
#
# Corre en windows-latest y NO en ubuntu como el smoke del mock: ChequeAR.Api es
# un proyecto web legacy (ProjectTypeGuids con el flavor de ASP.NET Web Application)
# que importa `Microsoft.WebApplication.targets` desde la instalacion de Visual
# Studio. `dotnet build` no resuelve ese import, asi que el build va con el MSBuild
# completo. Los otros cuatro proyectos son SDK-style y no tendrian ese problema.
#
# Sobre los tests: se buildea la solucion entera (incluido MockHospital.Tests, que
# compila sin necesidad de base), pero se ejecutan ChequeAR.Tests, ChequeAR.Api.Tests y
# los tests de integracion que no necesitan base. Los que si la necesitan estan marcados
# [Trait("Requires", "Oracle")] y quedan excluidos: correrlos aca los dejaria colgados.

name: build & test

# Solo por PR. El push quedo limitado a main porque al mergear un PR a dev o a
# testing el push disparaba una segunda corrida identica a la del PR que se acaba
# de aprobar. En main se mantiene: es la rama que deploy.yml publica, y conviene
# tener el build registrado sobre el commit exacto que sale a produccion.
on:
  pull_request:
    branches: [dev, testing, main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Un push nuevo sobre la misma rama (o sobre el PR) cancela la corrida anterior.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

# El GITHUB_TOKEN sólo lee el repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # MSBuild de la VS del runner (agrega msbuild.exe al PATH).
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # Necesario para `dotnet test`: el runner de xunit corre sobre net471,
      # pero la CLI que lo lanza es la del SDK.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache de NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Locked mode: falla si un packages.lock.json no coincide con los csproj.
      - name: Restore
        run: msbuild src\ChequeAR.sln -t:Restore -p:RestoreLockedMode=true -v:minimal -nologo

      # -warnaserror: cualquier warning nuevo frena el PR. Se pudo prender recien
      # cuando el build quedo en cero (CS0105 y MSB3247, mismo PR que este cambio).
      # Va solo en el build; el restore queda sin promover para que un NU### de un
      # paquete de terceros no bloquee sin que haya nada que arreglar de este lado.
      - name: Build (Release)
        run: msbuild src\ChequeAR.sln -v:minimal -nologo -p:Configuration=Release -m -warnaserror

      # -p:CollectCoverage + umbrales de 85% en líneas y 75% en ramas (en el csproj): si la cobertura de
      # Domain+Application cae por debajo del minimo, dotnet test devuelve exit code
      # distinto de cero y el job se pone en rojo, igual que con -warnaserror arriba.
      - name: Tests unitarios
        run: >
          dotnet test src\ChequeAR.Tests\ChequeAR.Tests.csproj
          -c Release --no-build --nologo
          -p:CollectCoverage=true
          -p:CoverletOutput=..\..\TestResults\coverage\
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      # Autorizacion de cada accion, binding redirects de Web.config y filtros de la Api.
      - name: Tests de la Api
        run: >
          dotnet test src\ChequeAR.Api.Tests\ChequeAR.Api.Tests.csproj
          -c Release --no-build --nologo
          --logger "trx;LogFileName=api.trx"
          --results-directory TestResults

      # Del proyecto de integracion, los 2 que NO necesitan base: normalizacion de
      # valores del driver Oracle. Viven ahi y no en ChequeAR.Tests porque referencian
      # ChequeAR.Infrastructure, y esa barrera es deliberada. El resto de ese proyecto
      # esta marcado [Trait("Requires", "Oracle")] y queda excluido.
      - name: Tests de infraestructura sin base
        run: >
          dotnet test tests\integration\MockHospital.Tests\MockHospital.Tests.csproj
          -c Release --no-build --nologo
          --filter "Requires!=Oracle"
          --logger "trx;LogFileName=infra.trx"
          --results-directory TestResults

      - name: Tests de Infrastructure sin base
        run: >
          dotnet test tests\integration\ChequeAR.Infrastructure.Tests\ChequeAR.Infrastructure.Tests.csproj
          -c Release --no-build --nologo
          --filter "Requires!=Oracle"
          --logger "trx;LogFileName=infra-chequear.trx"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/coverage/*.xml
          if-no-files-found: warn
