# Deploy de ChequeAR a Azure App Service (Windows, .NET Framework 4.8).

name: deploy

# Sólo después de que "build & test" termina bien sobre main, y con ese mismo commit.
# Para volver a desplegar, se corre "build & test" a mano sobre main.
on:
  workflow_run:
    workflows: ["build & test"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: chequear
  PUBLISH_DIR: ${{ github.workspace }}\publish

# El GITHUB_TOKEN sólo lee el repo.
permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: windows-2025
    # Los aprobadores, si se quieren, se configuran en el environment desde GitHub.
    environment: production
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Cache de NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: msbuild src\ChequeAR.sln -t:Restore -p:RestoreLockedMode=true -v:minimal -nologo


      - name: Publish a carpeta
        run: >
          msbuild src\ChequeAR.Api\ChequeAR.Api.csproj
          -v:minimal -nologo
          -p:Configuration=Release
          -p:DeployOnBuild=true
          -p:DeployDefaultTarget=WebPublish
          -p:WebPublishMethod=FileSystem
          -p:DeleteExistingFiles=true
          -p:publishUrl=${{ env.PUBLISH_DIR }}


      - name: Escribir los config con secretos
        shell: pwsh
        env:
          CONNSTR_CHEQUEAR: ${{ secrets.CHEQUEAR_CONNECTIONSTRING }}
          JWT_SIGNING_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
          ORACLE_CONNECTIONSTRING: ${{ secrets.ORACLE_CONNECTIONSTRING }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # ORACLE_CONNECTIONSTRING es opcional a proposito: mientras el hospital no
          # exponga su base, se publica vacio y la app entra en MockOracleViewClient.
          foreach ($name in 'CONNSTR_CHEQUEAR', 'JWT_SIGNING_SECRET', 'DEPLOY_KEY') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Falta el secret $name en el repositorio"
            }
          }

          # Escape para que una password con & o < no rompa el XML.
          $connStr = [System.Security.SecurityElement]::Escape($env:CONNSTR_CHEQUEAR)
          $jwt     = [System.Security.SecurityElement]::Escape($env:JWT_SIGNING_SECRET)
          $deployKey = [System.Security.SecurityElement]::Escape($env:DEPLOY_KEY)
          # Escape(null) explota: sin secret, cadena vacia (=> MockOracleViewClient).
          $oracleRaw = if ([string]::IsNullOrWhiteSpace($env:ORACLE_CONNECTIONSTRING)) { '' } else { $env:ORACLE_CONNECTIONSTRING }
          $oracle  = [System.Security.SecurityElement]::Escape($oracleRaw)

          $conn = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<connectionStrings>',
            ('  <add name="ChequeAR" connectionString="' + $connStr + '" providerName="Oracle.ManagedDataAccess.Client" />'),
            '</connectionStrings>'
          )
          $conn | Set-Content (Join-Path $env:PUBLISH_DIR 'Web.ConnectionStrings.config') -Encoding utf8

          $secrets = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<appSettings>',
            ('  <add key="Jwt:SigningSecret" value="' + $jwt + '" />'),
            ('  <add key="Oracle:ConnectionString" value="' + $oracle + '" />'),
            ('  <add key="Deploy:Key" value="' + $deployKey + '" />'),
            '</appSettings>'
          )
          $secrets | Set-Content (Join-Path $env:PUBLISH_DIR 'Web.Secrets.config') -Encoding utf8

      - name: Verificar el paquete
        shell: pwsh
        run: |
          $webConfig = Join-Path $env:PUBLISH_DIR 'Web.config'
          if (-not (Test-Path $webConfig)) {
            throw "No se genero Web.config en $env:PUBLISH_DIR"
          }
          if ((Select-String -Path $webConfig -Pattern 'debug="true"' -Quiet)) {
            throw "El Web.config publicado conserva debug=true: no se aplico Web.Release.config"
          }
          foreach ($f in 'Web.ConnectionStrings.config', 'Web.Secrets.config') {
            $path = Join-Path $env:PUBLISH_DIR $f
            if (-not (Test-Path $path)) { throw "Falta $f en el paquete" }
            [xml](Get-Content $path -Raw) | Out-Null   # falla si quedo XML invalido
          }
          if (-not (Select-String -Path $webConfig -Pattern '%HOME%' -Quiet)) {
            throw "El Web.config publicado no tiene los roots bajo %HOME%: no se aplico Web.Release.config"
          }

      - name: Deploy a Azure App Service
        id: azure
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

      # La app no migra sola en producción: lo hace este paso, con un export previo del esquema
      # (la Autonomous Always Free no tiene backups). Corre adentro de la app, que es la que
      # tiene el wallet, y en segundo plano: se lanza y se consulta hasta que termina.
      - name: Migrar la base
        shell: pwsh
        env:
          APP_URL: ${{ steps.azure.outputs.webapp-url }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          $url = $env:APP_URL.TrimEnd('/') + '/api/deploy/migrate'
          $headers = @{ 'X-Deploy-Key' = $env:DEPLOY_KEY }
          $r = $null
          for ($i = 1; $i -le 20 -and -not $r; $i++) {
            try { $r = Invoke-RestMethod $url -Method Post -Headers $headers -Body '' -TimeoutSec 120 }
            catch { "Intento ${i}: $($_.Exception.Message)"; Start-Sleep -Seconds 15 }
          }
          if (-not $r) { throw "No se pudo lanzar la migración en $url" }
          # Azure reinicia el sitio al terminar de aplicar el paquete, a veces con la migración
          # ya lanzada: el estado vuelve a 'idle' y hay que lanzarla de nuevo.
          $relanzadas = 0
          for ($i = 0; ($r.State -eq 'running' -or ($r.State -eq 'idle' -and $relanzadas -lt 5)) -and $i -lt 180; $i++) {
            Start-Sleep -Seconds 10
            if ($r.State -eq 'idle') {
              $relanzadas++
              "La app se reinició: se relanza la migración ($relanzadas)"
              try { $r = Invoke-RestMethod $url -Method Post -Headers $headers -Body '' -TimeoutSec 120 }
              catch { "Relanzar: $($_.Exception.Message)" }
              continue
            }
            try { $r = Invoke-RestMethod $url -Headers $headers -TimeoutSec 60 }
            catch { "Consulta: $($_.Exception.Message)" }
          }
          $r | ConvertTo-Json
          foreach ($w in $r.Warnings) { "::warning::$w" }
          if ($r.State -ne 'done') { throw "La migración no terminó: $($r.Error)" }

      # Que la base responda y no hayan quedado migraciones sin aplicar.
      - name: Smoke
        shell: pwsh
        env:
          APP_URL: ${{ steps.azure.outputs.webapp-url }}
        run: |
          $url = $env:APP_URL.TrimEnd('/') + '/api/health'
          for ($i = 1; $i -le 20; $i++) {
            try {
              $r = Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 60
              if ($r.StatusCode -eq 200) { "OK: $url"; exit 0 }
            } catch { "Intento ${i}: $($_.Exception.Message)" }
            Start-Sleep -Seconds 15
          }
          throw "La app no responde en $url"
