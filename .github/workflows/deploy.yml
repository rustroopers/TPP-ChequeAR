# Deploy de ChequeAR a Azure App Service (Windows, .NET Framework 4.8).

name: deploy

# Sólo después de que "build & test" termina bien sobre main, y con ese mismo commit.
# Para volver a desplegar, se corre "build & test" a mano sobre main.
on:
  workflow_run:
    workflows: ["build & test"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: chequear
  PUBLISH_DIR: ${{ github.workspace }}\publish

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: microsoft/setup-msbuild@v2

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: msbuild src\ChequeAR.sln -t:Restore -v:minimal -nologo


      - name: Publish a carpeta
        run: >
          msbuild src\ChequeAR.Api\ChequeAR.Api.csproj
          -v:minimal -nologo
          -p:Configuration=Release
          -p:DeployOnBuild=true
          -p:DeployDefaultTarget=WebPublish
          -p:WebPublishMethod=FileSystem
          -p:DeleteExistingFiles=true
          -p:publishUrl=${{ env.PUBLISH_DIR }}


      - name: Escribir los config con secretos
        shell: pwsh
        env:
          CONNSTR_CHEQUEAR: ${{ secrets.CHEQUEAR_CONNECTIONSTRING }}
          JWT_SIGNING_SECRET: ${{ secrets.JWT_SIGNING_SECRET }}
          ORACLE_CONNECTIONSTRING: ${{ secrets.ORACLE_CONNECTIONSTRING }}
        run: |
          # ORACLE_CONNECTIONSTRING es opcional a proposito: mientras el hospital no
          # exponga su base, se publica vacio y la app entra en MockOracleViewClient.
          foreach ($name in 'CONNSTR_CHEQUEAR', 'JWT_SIGNING_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Falta el secret $name en el repositorio"
            }
          }

          # Escape para que una password con & o < no rompa el XML.
          $connStr = [System.Security.SecurityElement]::Escape($env:CONNSTR_CHEQUEAR)
          $jwt     = [System.Security.SecurityElement]::Escape($env:JWT_SIGNING_SECRET)
          # Escape(null) explota: sin secret, cadena vacia (=> MockOracleViewClient).
          $oracleRaw = if ([string]::IsNullOrWhiteSpace($env:ORACLE_CONNECTIONSTRING)) { '' } else { $env:ORACLE_CONNECTIONSTRING }
          $oracle  = [System.Security.SecurityElement]::Escape($oracleRaw)

          $conn = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<connectionStrings>',
            ('  <add name="ChequeAR" connectionString="' + $connStr + '" providerName="Oracle.ManagedDataAccess.Client" />'),
            '</connectionStrings>'
          )
          $conn | Set-Content (Join-Path $env:PUBLISH_DIR 'Web.ConnectionStrings.config') -Encoding utf8

          $secrets = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<appSettings>',
            ('  <add key="Jwt:SigningSecret" value="' + $jwt + '" />'),
            ('  <add key="Oracle:ConnectionString" value="' + $oracle + '" />'),
            '  <add key="Auth:AllowDebugLoginFallback" value="false" />',
            '</appSettings>'
          )
          $secrets | Set-Content (Join-Path $env:PUBLISH_DIR 'Web.Secrets.config') -Encoding utf8

      - name: Verificar el paquete
        shell: pwsh
        run: |
          $webConfig = Join-Path $env:PUBLISH_DIR 'Web.config'
          if (-not (Test-Path $webConfig)) {
            throw "No se genero Web.config en $env:PUBLISH_DIR"
          }
          if ((Select-String -Path $webConfig -Pattern 'debug="true"' -Quiet)) {
            throw "El Web.config publicado conserva debug=true: no se aplico Web.Release.config"
          }
          foreach ($f in 'Web.ConnectionStrings.config', 'Web.Secrets.config') {
            $path = Join-Path $env:PUBLISH_DIR $f
            if (-not (Test-Path $path)) { throw "Falta $f en el paquete" }
            [xml](Get-Content $path -Raw) | Out-Null   # falla si quedo XML invalido
          }
          if (-not (Select-String -Path $webConfig -Pattern '%HOME%' -Quiet)) {
            throw "El Web.config publicado no tiene los roots bajo %HOME%: no se aplico Web.Release.config"
          }

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
